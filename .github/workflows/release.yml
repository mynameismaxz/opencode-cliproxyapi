name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run test
      - run: ./scripts/install-hosts.sh
      - run: bun run test:integration
        env:
          CI: "true"

      - name: Publish (token)
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance --access public

      - name: Publish (trusted publishing)
        if: env.NPM_TOKEN == ''
        run: npm publish --provenance --access public
